<ion-header class="settings-header">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="settings-content">

  <!-- PROFILE CARD -->
  <div class="profile-card">
    <div class="avatar">
      <ion-icon name="person-outline"></ion-icon>
    </div>
    <div class="profile-info">
      <h3 class="profile-name">{{ userName || 'User' }}</h3>
      <p class="profile-email">{{ userEmail || '' }}</p>
    </div>
  </div>

  <!-- ACCOUNT -->
  <div class="section">
    <p class="section-label">Account</p>
    <div class="settings-list">

<!-- Edit Profile row — opens modal -->
<div class="settings-row" (click)="openEditProfile()">
  <div class="row-left">
    <div class="row-icon green"><ion-icon name="person-circle-outline"></ion-icon></div>
    <span>Edit Profile</span>
  </div>
  <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
</div>

<!-- EDIT PROFILE MODAL -->
<ion-modal [isOpen]="showEditModal" (didDismiss)="showEditModal=false"
  [breakpoints]="[0,0.6]" [initialBreakpoint]="0.6">
  <ng-template>
    <ion-content class="modal-body">
      <div class="modal-handle"></div>
      <h3 class="modal-title">Edit Profile</h3>

      <div class="edit-field">
        <label>Display Name</label>
        <ion-item lines="none" class="edit-input">
          <ion-icon slot="start" name="person-outline"></ion-icon>
          <ion-input [(ngModel)]="editName" placeholder="Your name"></ion-input>
        </ion-item>
      </div>

      <div class="edit-field">
        <label>Email</label>
        <ion-item lines="none" class="edit-input disabled-input">
          <ion-icon slot="start" name="mail-outline"></ion-icon>
          <ion-input [value]="userEmail" readonly></ion-input>
        </ion-item>
        <p class="field-note">Email cannot be changed</p>
      </div>

      <ion-button expand="block" class="save-btn"
        (click)="saveProfile()" [disabled]="isSaving">
        <ion-spinner *ngIf="isSaving" name="crescent" slot="start"></ion-spinner>
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>

      <div class="settings-row">
        <div class="row-left">
          <div class="row-icon blue"><ion-icon name="lock-closed-outline"></ion-icon></div>
          <span>Change Password</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </div>

    </div>
  </div>

  <!-- PREFERENCES -->
  <div class="section">
    <p class="section-label">Preferences</p>
    <div class="settings-list">

      <div class="settings-row">
        <div class="row-left">
          <div class="row-icon purple"><ion-icon name="notifications-outline"></ion-icon></div>
          <span>Notifications</span>
        </div>
        <ion-toggle [(ngModel)]="notificationsEnabled" class="green-toggle"></ion-toggle>
      </div>

      <div class="settings-row">
        <div class="row-left">
          <div class="row-icon orange"><ion-icon name="moon-outline"></ion-icon></div>
          <span>Dark Mode</span>
        </div>
        <ion-toggle [(ngModel)]="darkMode" class="green-toggle" (ionChange)="toggleDarkMode()"></ion-toggle>
      </div>

    </div>
  </div>

  <!-- SUPPORT -->
  <div class="section">
    <p class="section-label">Support</p>
    <div class="settings-list">

      <div class="settings-row" (click)="comingSoon()">
        <div class="row-left">
          <div class="row-icon teal"><ion-icon name="help-circle-outline"></ion-icon></div>
          <span>Help & FAQ</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </div>

      <div class="settings-row" (click)="comingSoon()">
        <div class="row-left">
          <div class="row-icon gray"><ion-icon name="information-circle-outline"></ion-icon></div>
          <span>About App</span>
        </div>
        <ion-label class="version-label">v1.0.0</ion-label>
      </div>

    </div>
  </div>
 <!-- Add this row after Edit Profile row -->
<div class="settings-row" (click)="goToRank()">
  <div class="row-left">
    <div class="row-icon gold"><ion-icon name="podium-outline"></ion-icon></div>
    <span>My Rank</span>
  </div>
  <div class="rank-preview" *ngIf="myRank > 0">
    <span class="rank-badge">#{{ myRank }}</span>
  </div>
  <ion-icon name="chevron-forward-outline" class="chevron" *ngIf="myRank === 0"></ion-icon>
</div>
  <!-- LOGOUT -->
  <div class="logout-section">
    <ion-button class="logout-btn" (click)="confirmLogout()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      Log Out
    </ion-button>
  </div>

</ion-content>

<!-- LOGOUT CONFIRM ALERT -->
<ion-alert
  [isOpen]="showLogoutAlert"
  header="Log Out"
  message="Are you sure you want to log out?"
  [buttons]="alertButtons">
</ion-alert>
