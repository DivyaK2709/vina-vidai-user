<ion-content class="signup-bg">
  <div class="signup-container">
    <div class="signup-card">

      <h1 class="logo">QUIZER</h1>
      <h2 class="title">Create Account</h2>
      <p class="subtitle">Create an account to continue</p>

      <form (ngSubmit)="onSubmit()" #signupForm="ngForm" autocomplete="off" novalidate>

        <!-- USERNAME -->
        <div class="input-wrapper">
          <ion-item lines="none" class="input-item"
            [class.valid-label]="isUsernameValid() || isUsernameFocused">
            <ion-label position="floating">Username</ion-label>
            <ion-input
              type="text"
              [(ngModel)]="username"
              name="username"
              required
              placeholder="e.g. johnsmith"
              (ionFocus)="isUsernameFocused = true"
              (ionBlur)="isUsernameFocused = false"
              (ionInput)="updateIcon('username')">
            </ion-input>
          </ion-item>

          <!-- ICON → keep as is -->
          <img class="field-icon"
            [src]="icons.username ? 'assets/icon/user_click.png' : 'assets/icon/user.png'">
        </div>

        <p *ngIf="username && !isUsernameValid()" class="error-msg">
          Username must be alphabetic & at least 3 characters
        </p>

        <!-- EMAIL -->
        <div class="input-wrapper">
          <ion-item lines="none" class="input-item"
            [class.valid-label]="isEmailValid()">
            <ion-label position="floating">Email</ion-label>
            <ion-input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="e.g. john@example.com"
              (ionInput)="updateIcon('email')">
            </ion-input>
          </ion-item>

          <img class="field-icon"
            [src]="isEmailValid() ? 'assets/icon/email_click.png' : 'assets/icon/email.png'">
        </div>

        <p *ngIf="email && !isEmailValid()" class="error-msg">
          Please enter a valid email address
        </p>
<div class="input-wrapper">
  <ion-item lines="none" class="input-item"
    [class.valid-label]="isPasswordValid()">
    <ion-label position="floating">Password</ion-label>
    <ion-input
      [type]="showPassword ? 'text' : 'password'"
      [(ngModel)]="password"
      name="password"
      required
      minlength="6"
      placeholder="At least 6 characters"
      (ionInput)="updateIcon('password')">
    </ion-input>
  </ion-item>

  <!-- CUSTOM EYE ICON -->
  <img
    class="eye-icon"
    [src]="showPassword ? 'assets/icon/password_click.png' : 'assets/icon/password.png'"
    (click)="togglePassword()">
</div>


        <p *ngIf="password && !isPasswordValid()" class="error-msg">
          Password must be at least 6 characters
        </p>

        <!-- CONFIRM PASSWORD (REMOVED PASSWORD ICON) -->
 <div class="input-wrapper">
  <ion-item lines="none" class="input-item"
    [class.valid-label]="isConfirmPasswordValid()">
    <ion-label position="floating">Confirm Password</ion-label>
    <ion-input
      [type]="showConfirmPassword ? 'text' : 'password'"
      [(ngModel)]="confirmPassword"
      name="confirmPassword"
      required
      placeholder="Repeat password"
      (ionInput)="updateIcon('confirmPassword')">
    </ion-input>
  </ion-item>

  <!-- CUSTOM EYE ICON -->
  <img
    class="eye-icon"
    [src]="showConfirmPassword ? 'assets/icon/password_click.png' : 'assets/icon/password.png'"
    (click)="toggleConfirmPassword()">
</div>


        <p *ngIf="confirmPassword && !isConfirmPasswordValid()" class="error-msg">
          Passwords do not match
        </p>

        <!-- BUTTON -->
        <div class="signup-button-wrapper">
          <ion-button expand="block" type="submit"
            class="signup-button"
            [disabled]="!signupForm.valid || !isFormValid()">
            Register
          </ion-button>
        </div>

      </form>

      <div class="signin-link">
        <ion-text>Already a User?</ion-text>
        <span class="signin-text" (click)="goToSignin()"> Sign In</span>
      </div>

    </div>
  </div>
</ion-content>
