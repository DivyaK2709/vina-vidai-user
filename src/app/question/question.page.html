<ion-header class="question-header">
  <ion-toolbar>
    <ion-title>Quiz Setup</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="center-content" fullscreen>
  <div class="card-wrapper">

    <!-- PROGRESS DOTS -->
    <div class="step-indicator">
      <div class="step-dot" [class.active]="step >= 1" [class.done]="step > 1">
        <ion-icon *ngIf="step > 1" name="checkmark"></ion-icon>
        <span *ngIf="step <= 1">1</span>
      </div>
      <div class="step-line" [class.active]="step > 1"></div>
      <div class="step-dot" [class.active]="step >= 2">
        <span>2</span>
      </div>
    </div>

    <!-- STEP 1 -->
    <div *ngIf="step === 1" class="card animate-in">
      <div class="card-icon">
        <ion-icon name="help-circle-outline"></ion-icon>
      </div>
      <h2 class="quiz-title">Questions</h2>
      <p class="quiz-subtitle">How many questions do you want to attempt?</p>

      <!-- QUICK SELECT CHIPS -->
      <div class="chip-row">
        <span class="chip" *ngFor="let n of quickCounts"
          [class.selected]="numQuestions === n"
          (click)="numQuestions = n">
          {{ n }}
        </span>
      </div>

      <div class="divider-text">or enter manually</div>

      <ion-item class="no-bg-item">
        <ion-input
          type="number"
          placeholder="e.g. 15"
          [(ngModel)]="numQuestions"
          min="1" max="100">
        </ion-input>
      </ion-item>

      <p class="hint" *ngIf="numQuestions && numQuestions > 100" class="error-hint">
        Max 100 questions allowed
      </p>

      <div class="button-row single">
        <ion-button class="primary-btn" expand="block"
          (click)="nextStep()"
          [disabled]="!numQuestions || numQuestions < 1 || numQuestions > 100">
          Continue
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div *ngIf="step === 2" class="card animate-in">
      <div class="card-icon">
        <ion-icon name="timer-outline"></ion-icon>
      </div>
      <h2 class="quiz-title">Time Limit</h2>
      <p class="quiz-subtitle">Select how much time you want for the quiz</p>

      <!-- TIME OPTION CARDS -->
      <div class="time-options">
        <div class="time-card"
          *ngFor="let opt of timeOptions"
          [class.selected]="timeSelected === opt.value"
          (click)="timeSelected = opt.value">
          <ion-icon [name]="opt.icon"></ion-icon>
          <span class="time-label">{{ opt.label }}</span>
          <span class="time-sub">{{ opt.sub }}</span>
        </div>
      </div>

      <div class="button-row">
        <ion-button class="back-btn" (click)="prevStep()">
          <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
          Back
        </ion-button>
        <ion-button class="primary-btn" (click)="nextStep()"
          [disabled]="!timeSelected">
          Start Test
          <ion-icon slot="end" name="play-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <!-- SUMMARY CHIP -->
    <div class="summary-bar" *ngIf="step === 2 && numQuestions">
      <ion-icon name="information-circle-outline"></ion-icon>
      {{ numQuestions }} questions selected
    </div>

  </div>
</ion-content>
