<ion-content class="signin-bg">
  <div class="signin-container">
    <div class="signin-card">

      <div class="logo-wrapper">
        <span class="logo">QUIZER</span>
      </div>
      <h2 class="title">Welcome Back</h2>
      <p class="subtitle">Sign in with your email or username</p>

      <form #signinForm="ngForm" (ngSubmit)="onSignIn()" autocomplete="off" novalidate>

        <!-- Autofill breakers -->
        <input type="text" style="display:none" autocomplete="off">
        <input type="password" style="display:none" autocomplete="new-password">

        <!-- EMAIL / USERNAME -->
        <div class="input-wrapper">
          <ion-item lines="none" class="input-item"
            [class.valid-item]="emailOrUsername && !usernameError"
            [class.error-item]="usernameError">
            <ion-icon slot="start" name="person-outline" class="inline-icon"></ion-icon>
            <ion-input
              type="text"
              [(ngModel)]="emailOrUsername"
              name="emailOrUsername"
              required
              autocomplete="off"
              placeholder="Email or Username"
              (ionFocus)="setActive('email')"
              (ionBlur)="clearActive('email')"
              (ionInput)="validateEmailOrUsername()">
            </ion-input>
            <ion-icon slot="end" *ngIf="emailOrUsername"
              [name]="usernameError ? 'close-circle' : 'checkmark-circle'"
              [color]="usernameError ? 'danger' : 'success'"
              class="status-icon">
            </ion-icon>
          </ion-item>
          <p *ngIf="usernameError" class="error-msg">
            <ion-icon name="alert-circle-outline"></ion-icon>{{ usernameError }}
          </p>
        </div>

        <!-- PASSWORD -->
        <div class="input-wrapper">
          <ion-item lines="none" class="input-item"
            [class.valid-item]="password && !passwordError"
            [class.error-item]="passwordError">
            <ion-icon slot="start" name="lock-closed-outline" class="inline-icon"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="Password"
              (ionFocus)="setActive('password')"
              (ionBlur)="clearActive('password')"
              (ionInput)="validatePassword()">
            </ion-input>
            <ion-icon slot="end" class="eye-toggle"
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              (click)="togglePassword()">
            </ion-icon>
          </ion-item>
          <p *ngIf="passwordError" class="error-msg">
            <ion-icon name="alert-circle-outline"></ion-icon>{{ passwordError }}
          </p>
        </div>

        <!-- FORGOT PASSWORD -->
        <div class="forgot-row">
          <span class="forgot-text" (click)="goToForgotPassword()">Forgot password?</span>
        </div>

        <!-- SUBMIT -->
        <ion-button expand="block" class="signin-button" type="submit"
          [disabled]="!signinForm.valid || isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
          {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </ion-button>

      </form>

      <div class="divider"><span>or</span></div>

      <div class="signup-link">
        Don't have an account?
        <span class="signup-text" (click)="goToSignup()">Create one</span>
      </div>

    </div>
  </div>
</ion-content>
